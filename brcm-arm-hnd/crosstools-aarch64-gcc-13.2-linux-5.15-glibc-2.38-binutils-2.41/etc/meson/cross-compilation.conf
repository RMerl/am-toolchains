# Note: Buildroot's and Meson's terminologies differ about the meaning
# of 'build', 'host' and 'target':
# - Buildroot's 'host' is Meson's 'build'
# - Buildroot's 'target' is Meson's 'host'

[binaries]
c = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/bin/aarch64-buildroot-linux-gnu-gcc'
cpp = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/bin/aarch64-buildroot-linux-gnu-g++'
ar = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/bin/aarch64-buildroot-linux-gnu-gcc-ar'
strip = '/bin/true'
cmake = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/bin/cmake'
fortran = '/bin/false'
pkg-config = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/bin/pkgconf'
g-ir-compiler = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/aarch64-buildroot-linux-gnu/sysroot/usr/bin/g-ir-compiler'
g-ir-scanner = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/aarch64-buildroot-linux-gnu/sysroot/usr/bin/g-ir-scanner'

[built-in options]
c_args = ['-D_LARGEFILE_SOURCE', '-D_LARGEFILE64_SOURCE', '-D_FILE_OFFSET_BITS=64', '-Os', '-g2', '-D_FORTIFY_SOURCE=2']
c_link_args = []
cpp_args = ['-D_LARGEFILE_SOURCE', '-D_LARGEFILE64_SOURCE', '-D_FILE_OFFSET_BITS=64', '-Os', '-g2', '-D_FORTIFY_SOURCE=2']
cpp_link_args = []
fortran_args = ['-Os', '-g2']
fortran_link_args = []
wrap_mode = 'nodownload'
cmake_prefix_path = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/aarch64-buildroot-linux-gnu/sysroot/usr/lib/cmake'

[properties]
needs_exe_wrapper = true
sys_root = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/aarch64-buildroot-linux-gnu/sysroot'
pkg_config_libdir = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/aarch64-buildroot-linux-gnu/sysroot/usr/lib/pkgconfig:/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/aarch64-buildroot-linux-gnu/sysroot/usr/share/pkgconfig'
pkg_config_static = 'false'
# enable meson build to pass a toolchain file to cmake
cmake_toolchain_file = '/auto/toolbuild/bintools//crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/share/buildroot/toolchainfile.cmake'
cmake_defaults = false

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
